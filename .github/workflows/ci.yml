name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile sources
        run: python -m compileall -q src

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Scan clean examples (must pass)
        env:
          PYTHONPATH: src
        run: python -m solsentry scan examples/clean --fail-on high

      - name: Scan vulnerable examples (exit 1 expected)
        env:
          PYTHONPATH: src
        run: |
          set +e
          python -m solsentry scan examples/vulnerable \
            --format sarif --output solsentry.sarif --fail-on high
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected exit code 1, got $status"
            exit 1
          fi

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solsentry-sarif-py${{ matrix.python-version }}
          path: solsentry.sarif
          if-no-files-found: ignore
